name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  target: x86_64-linux-musl }
          - { arch: aarch64, target: aarch64-linux-musl }
          - { arch: armv7,   target: arm-linux-musleabihf }
          - { arch: i386,    target: x86-linux-musl }
          - { arch: s390x,   target: s390x-linux-gnu, gcc: gcc-s390x-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        if: ${{ !matrix.gcc }}
        with: { version: 0.13.0 }
      - name: Install cross gcc (zig 0.13 cannot build s390x)
        if: ${{ matrix.gcc }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ${{ matrix.gcc }}
      - name: Build static binary
        run: |
          if [ -n "${{ matrix.gcc }}" ]; then export CC=${{ matrix.target }}-gcc; else export CC="zig cc -target ${{ matrix.target }}"; fi
          ./build.c build
          file nome
          mkdir -p dist && cp nome dist/nome-linux-${{ matrix.arch }}
      - name: Smoke test (x86_64 runs natively)
        if: matrix.arch == 'x86_64'
        run: |
          ./nome --version && ./nome --help >/dev/null
          ./build.c --prefix "$RUNNER_TEMP/p" && test -f "$RUNNER_TEMP/p/share/man/man1/nome.1"
          ./build.c uninstall --prefix "$RUNNER_TEMP/p"
      - uses: actions/upload-artifact@v4
        with: { name: "nome-linux-${{ matrix.arch }}", path: dist/* }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish release assets
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
        run: |
          cd dist && sha256sum nome-linux-* > SHA256SUMS
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "nome ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" nome-linux-* SHA256SUMS --clobber
