name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: x86_64,  runner: ubuntu-latest, cc: "zig cc -target x86_64-linux-musl" }
          - { os: linux, arch: aarch64, runner: ubuntu-latest, cc: "zig cc -target aarch64-linux-musl" }
          - { os: linux, arch: armv7,   runner: ubuntu-latest, cc: "zig cc -target arm-linux-musleabihf" }
          - { os: linux, arch: i386,    runner: ubuntu-latest, cc: "zig cc -target x86-linux-musl" }
          - { os: linux, arch: s390x,   runner: ubuntu-latest, gcc: gcc-s390x-linux-gnu, cc: s390x-linux-gnu-gcc }
          - { os: macos, arch: aarch64, runner: macos-latest,  cc: cc }
          - { os: macos, arch: x86_64,  runner: macos-latest,  cc: "cc -arch x86_64" }
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        if: ${{ startsWith(matrix.cc, 'zig') }}
        with: { version: 0.13.0 }
      - name: Install cross gcc (zig 0.13 cannot build s390x)
        if: ${{ matrix.gcc }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ${{ matrix.gcc }}
      - name: Build
        run: |
          CC="${{ matrix.cc }}" ./build.c build
          file nome
          mkdir -p dist && cp nome dist/nome-${{ matrix.os }}-${{ matrix.arch }}
      - name: Smoke test and real Docker session (linux x86_64)
        if: matrix.os == 'linux' && matrix.arch == 'x86_64'
        run: |
          ./nome --version && ./nome --help >/dev/null
          ./build.c --prefix "$RUNNER_TEMP/p" && test -f "$RUNNER_TEMP/p/share/man/man1/nome.1"
          ./nome get alpine ci </dev/null
          test "$(SECRET=x ./nome ci sh -c 'echo $SECRET$(id -u)')" = 0
          ./nome ci ls /host/etc >/dev/null
          ./nome cp ci ci2 && ./nome rm ci2 && ./nome rm ci
          ./build.c uninstall --prefix "$RUNNER_TEMP/p"
      - name: Smoke test (macos)
        if: matrix.os == 'macos' && matrix.arch == 'aarch64'
        run: ./nome --version && ./nome --help >/dev/null
      - uses: actions/upload-artifact@v4
        with: { name: "nome-${{ matrix.os }}-${{ matrix.arch }}", path: dist/* }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish release assets
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
        run: |
          cd dist && sha256sum nome-* > SHA256SUMS
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "nome ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" nome-* SHA256SUMS --clobber
